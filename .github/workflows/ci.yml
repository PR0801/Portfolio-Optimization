name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        run: |
          npm ci --prefix frontend
          npm --prefix frontend run build
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[test]
      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 --max-line-length=88 portfolio_optimization tests
      - name: Format check with black
        run: |
          pip install black
          black --check portfolio_optimization run_example.py tests
      - name: Run tests
        run: |
          pytest -q
