[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-optimization"
version = "0.1.0"
description = "Modern Portfolio Theory based optimisation toolbox"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Generated by Antigravity", email = "pratyushraunak2019@gmail.com"}]
keywords = ["finance", "portfolio", "optimization", "MPT"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "yfinance",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["portfolio_optimization"]

[project.scripts]
portfolio-optimize = "portfolio_optimization.cli:main"
